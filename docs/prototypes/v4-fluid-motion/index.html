<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astra · 动效对比实验</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #080d10;
        color: #d9e5e6;
        font:
          14px/1.5 system-ui,
          'Microsoft YaHei',
          sans-serif;
      }
      main {
        max-width: 1560px;
        margin: auto;
        padding: 28px 32px;
      }
      .eyebrow {
        color: #66d9c7;
        font-size: 11px;
        letter-spacing: 0.18em;
      }
      h1 {
        margin: 8px 0 5px;
        font-size: 30px;
        font-weight: 550;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: #8d9ca1;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 22px 0;
      }
      button,
      select {
        background: #152026;
        border: 1px solid #263b40;
        color: #dce7e7;
        padding: 9px 14px;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #7ae4ce;
        color: #091513;
        border-color: #7ae4ce;
      }
      button:hover {
        border-color: #7ae4ce;
      }
      .boards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .board {
        border: 1px solid #263438;
        border-radius: 14px;
        overflow: hidden;
        background: #0e1418;
      }
      .board header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 13px 16px;
        border-bottom: 1px solid #263438;
      }
      .board header span {
        color: #798b92;
        font-size: 11px;
      }
      .board:last-child {
        border-color: #4b877c;
      }
      .board:last-child header span {
        color: #7ae4ce;
      }
      .stage {
        height: 540px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        display: block;
        max-height: 100%;
        max-width: 100%;
        touch-action: none;
      }
      footer {
        display: flex;
        gap: 22px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 18px;
        color: #8d9ca1;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      input {
        accent-color: #7ae4ce;
      }
      #seek {
        width: 250px;
      }
      output {
        min-width: 40px;
        color: #b9ceca;
      }
      #description {
        margin-top: 16px;
        max-width: 850px;
        color: #c1d2d2;
      }
      @media (max-width: 900px) {
        main {
          padding: 20px 14px;
        }
        .boards {
          grid-template-columns: 1fr;
        }
        .stage {
          height: 430px;
        }
        h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">ASTRA / MOTION STUDY</div>
      <h1>让作品真正流动</h1>
      <p>原生 Studio、上一版电影感与新候选并排比较。可切换作品、暂停定位，也可在画面上划动。</p>
      <div class="controls" id="motions"></div>
      <div class="controls">
        <label
          >作品
          <select id="source">
            <option value="portrait-reference.png">人像</option>
            <option value="pet.jpg">宠物</option>
            <option value="landscape.jpg">风景</option>
          </select></label
        >
        <label
          >模式
          <select id="mode">
            <option value="density">字符密度</option>
            <option value="color">原色字符</option>
            <option value="phrase">中文铺字</option>
            <option value="contour">线条轮廓</option>
            <option value="braille">盲文</option>
            <option value="halftone">网点</option>
          </select></label
        >
        <button id="pause">暂停</button><button id="restart">重新开始</button>
        <label
          >强度 <input id="strength" type="range" min="0" max="1" step="0.05" value="0.65" /><output
            id="amount"
            >0.65</output
          ></label
        >
      </div>
      <div class="boards">
        <section class="board">
          <header>原生 Studio 底座<span>基础对照</span></header>
          <div class="stage"><canvas id="studio" aria-label="Studio 动效"></canvas></div>
        </section>
        <section class="board">
          <header>上一版电影感<span>8832928</span></header>
          <div class="stage"><canvas id="baseline" aria-label="上一版动效"></canvas></div>
        </section>
        <section class="board">
          <header>流体动效候选<span>可操作原型</span></header>
          <div class="stage"><canvas id="candidate" aria-label="新动效候选"></canvas></div>
        </section>
      </div>
      <p id="description"></p>
      <footer>
        <label
          >时间 <input id="seek" type="range" min="0" max="12" step="0.02" value="0" /><output
            id="time"
            >0.00s</output
          ></label
        ><span>拖尾沿用 Studio 场 · 中文正向 · 无照片叠层</span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
