<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astra · 签名融合配色研究</title>
<style>
:root{color-scheme:light;--bg:#f5f3ed;--panel:#fffdf8;--text:#1c342b;--muted:#607064;--line:#d6dcd0;--accent:#254f3c;--soft:#e9eede;font:15px/1.6 "Microsoft YaHei",sans-serif}html[data-theme=dark]{color-scheme:dark;--bg:#101813;--panel:#19241d;--text:#edeedf;--muted:#acbaac;--line:#3c4c3e;--accent:#b9d98b;--soft:#263829}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{width:min(1320px,calc(100% - 40px));margin:30px auto 60px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}a{color:inherit;text-underline-offset:5px}.brand{font:24px Georgia,serif;letter-spacing:.14em;text-decoration:none}h1{font-size:clamp(28px,4vw,44px);font-weight:500;line-height:1.3;margin:30px 0 16px}.lead,.note{color:var(--muted);line-height:1.9;font-size:13px;max-width:880px}label{font-size:13px;display:grid;gap:8px}button,select,input{font:inherit;color:inherit;min-width:0;max-width:100%}button,select,input[type=text]{min-height:44px;padding:9px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px}option{color:var(--text);background:var(--panel)}button{cursor:pointer}button:hover{background:var(--soft);border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.controls{background:var(--panel);padding:20px;border-radius:16px;border:1px solid var(--line);margin:26px 0}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.wide{grid-column:span 2}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.status{min-height:58px;display:flex;align-items:center;gap:12px;margin:10px 0;font-size:13px;color:var(--muted)}.spin{border:2px solid var(--line);border-top-color:var(--accent);width:20px;height:20px;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}progress{height:5px;width:100%;max-width:640px;accent-color:var(--accent);display:block;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.host{aspect-ratio:3/4;display:flex;justify-content:center;align-items:center;background:var(--soft)}.host:empty::after{content:'正在准备同素材对照';font-size:13px;color:var(--muted)}.host canvas{display:block;width:100%;height:100%;object-fit:contain}figcaption{padding:16px}.card h2{font-size:20px;font-weight:500;margin:0 0 8px}.card p{font-size:12px;color:var(--muted);margin:8px 0}.crop{overflow:auto;background:var(--soft);border-radius:8px}.crop canvas{display:block;width:320px;height:190px;max-width:none}.card .actions button{flex:1;font-size:12px}.stats{min-height:40px}dialog{background:var(--panel);color:var(--text);width:min(1180px,94vw);max-height:94vh;padding:0;border:1px solid var(--line);border-radius:16px}dialog::backdrop{background:#000b}.toolbar{display:flex;padding:12px;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.viewer{height:68vh;overflow:auto;background:var(--soft)}.viewer canvas{display:block;margin:auto;max-width:none}#sample{display:block;max-width:100%;height:auto;background:#fffdf8;margin:12px 0;padding:12px;border-radius:8px}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{gap:12px}figcaption{padding:12px}.card h2{font-size:17px}}@media(max-width:620px){.grid{grid-template-columns:1fr}.host{max-height:70vh;aspect-ratio:auto}.host canvas{height:auto;max-height:70vh;object-fit:contain}.crop{max-width:100%}main{margin-top:20px}.controls{padding:16px}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head><body><main id="app"></main><script type="module" src="./main.ts"></script></body></html>
