<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Astra · 字符印刷风格研究</title>
<style>
:root{font:15px/1.6 "Microsoft YaHei","PingFang SC",sans-serif;font-synthesis:none;color-scheme:light;--bg:#f5f3ed;--panel:#fffdf8;--text:#1c342b;--muted:#607064;--line:#d6dcd0;--accent:#254f3c;--accent-text:#fff9ec;--soft:#e9eede;--focus:#648d35}html[data-theme=dark]{color-scheme:dark;--bg:#101813;--panel:#19241d;--text:#edeedf;--muted:#acbaac;--line:#3c4c3e;--accent:#cee6a4;--accent-text:#152819;--soft:#263829;--focus:#bcdb84}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}a{color:inherit;text-underline-offset:5px}button,input,select{font:inherit;color:inherit}button,select,input[type=text]{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 12px;max-width:100%;min-width:0}option{background:var(--panel);color:var(--text)}button{cursor:pointer}button:hover{background:var(--soft);border-color:var(--focus)}button:disabled{opacity:.55;cursor:default}.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}.primary:hover{background:var(--accent);filter:brightness(1.1)}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}header{width:min(1320px,calc(100% - 40px));margin:auto;padding:24px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line)}.brand{font:24px Georgia,serif;letter-spacing:.14em;text-decoration:none}.header-actions{display:flex;gap:16px;align-items:center;font-size:13px}main{width:min(1320px,calc(100% - 40px));margin:32px auto 60px}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}h1{font:500 clamp(28px,4vw,46px)/1.3 Georgia,"Microsoft YaHei",serif;margin:12px 0 18px}.lead{max-width:840px;color:var(--muted);margin:0 0 26px}.controls{padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.basic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}label{display:grid;gap:6px;font-size:13px}.wide{grid-column:span 2}.secondary{font-si
